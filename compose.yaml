services:
  ai:
    image: cast-ai:local
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env.deploy
        required: true
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - cast_ai_embeddings:/app/data/embeddings
    command:
      - uvicorn
      - src.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"

volumes:
  cast_ai_embeddings:

